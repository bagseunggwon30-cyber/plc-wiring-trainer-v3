<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" role="img" aria-labelledby="title desc">
  <title id="title">NPN three-wire inductive proximity sensor</title>
  <desc id="desc">Blue sensing face, threaded metal body, BN brown, BK black and BU blue conductors.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/><stop offset=".18" stop-color="#9aa1a7"/>
      <stop offset=".42" stop-color="#f7f7f6"/><stop offset=".68" stop-color="#717980"/><stop offset="1" stop-color="#d9dde0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38a0e5"/><stop offset="1" stop-color="#075f9c"/>
    </linearGradient>
    <pattern id="thread" width="5" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 1h5M0 4h5" stroke="#4f5960" stroke-width=".65" opacity=".72"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#111827" flood-opacity=".3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="12" y="27" width="28" height="66" rx="8" fill="url(#blue)" stroke="#064f81"/>
    <rect x="36" y="24" width="126" height="72" rx="5" fill="url(#steel)" stroke="#4b5563"/>
    <rect x="39" y="26" width="120" height="68" rx="3" fill="url(#thread)" opacity=".58"/>
    <path d="M75 21l10 7v64l-10 7-10-7V28z" fill="url(#steel)" stroke="#4b5563"/>
    <path d="M95 21l10 7v64l-10 7-10-7V28z" fill="url(#steel)" stroke="#4b5563"/>
    <rect x="142" y="28" width="23" height="64" rx="3" fill="#4338ca" stroke="#312e81"/>
    <text x="153.5" y="63" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" transform="rotate(-90 153.5 63)">NPN</text>
    <rect x="162" y="43" width="31" height="34" rx="8" fill="#171a1f" stroke="#050607"/>
  </g>
  <path d="M190 51C210 51 218 36 250 36" fill="none" stroke="#7c3f22" stroke-width="7" stroke-linecap="round"/>
  <path d="M190 60H250" fill="none" stroke="#15191e" stroke-width="7" stroke-linecap="round"/>
  <path d="M190 69C210 69 218 84 250 84" fill="none" stroke="#0877cc" stroke-width="7" stroke-linecap="round"/>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="7" font-weight="800" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="2">
    <text x="239" y="31" fill="#7c3f22">BN</text><text x="239" y="55" fill="#111827">BK</text><text x="239" y="79" fill="#0877cc">BU</text>
  </g>
</svg>
