name: native-ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PlcWiringTrainer.slnx
      - name: Core tests and coverage
        run: dotnet test native\PlcWiringTrainer.Core.Tests\PlcWiringTrainer.Core.Tests.csproj -c Release --no-restore --collect:"XPlat Code Coverage" --results-directory artifacts\TestResults\Coverage
      - name: Enforce Core coverage baseline
        shell: pwsh
        run: |
          $coveragePath = Get-ChildItem artifacts\TestResults\Coverage -Filter coverage.cobertura.xml -Recurse |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $coveragePath) { throw 'coverage.cobertura.xml was not produced' }
          [xml]$coverage = Get-Content $coveragePath.FullName
          $lineRate = [double]$coverage.coverage.'line-rate'
          $branchRate = [double]$coverage.coverage.'branch-rate'
          if ($lineRate -lt 0.8450) { throw "Core line coverage regressed: $lineRate < 0.8450" }
          if ($branchRate -lt 0.7700) { throw "Core branch coverage regressed: $branchRate < 0.7700" }
          $criticalClasses = @(
            @{ Name = 'PlcWiringTrainer.Core.Workbench.WorkbenchStore'; Line = 0.81; Branch = 0.57 },
            @{ Name = 'PlcWiringTrainer.Core.Wiring.ConnectionAssessmentService'; Line = 0.81; Branch = 0.73 },
            @{ Name = 'PlcWiringTrainer.Core.Validation.CircuitValidationService'; Line = 0.78; Branch = 0.78 }
          )
          foreach ($expected in $criticalClasses) {
            $class = $coverage.coverage.packages.package.classes.class |
              Where-Object name -eq $expected.Name |
              Select-Object -First 1
            if (-not $class) { throw "Critical coverage class is missing: $($expected.Name)" }
            $classLine = [double]$class.'line-rate'
            $classBranch = [double]$class.'branch-rate'
            if ($classLine -lt $expected.Line) {
              throw "Critical class line coverage regressed: $($expected.Name) $classLine < $($expected.Line)"
            }
            if ($classBranch -lt $expected.Branch) {
              throw "Critical class branch coverage regressed: $($expected.Name) $classBranch < $($expected.Branch)"
            }
          }
          "Core coverage: line={0:P2}, branch={1:P2}" -f $lineRate, $branchRate
      - run: dotnet build PlcWiringTrainer.slnx -c Release --no-restore
      - run: dotnet build native\PlcWiringTrainer.App\PlcWiringTrainer.App.csproj -c Release -p:Platform=x64 --no-restore
      - run: dotnet publish native\PlcWiringTrainer.App\PlcWiringTrainer.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o artifacts\publish\win-x64 --no-restore
      - run: dotnet format PlcWiringTrainer.slnx --verify-no-changes --no-restore
      - name: Upload Core coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-coverage
          path: artifacts/TestResults/Coverage/**/coverage.cobertura.xml
      - name: Reject browser runtime files
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object { $_ -match '\.(html?|mjs|cjs|js|jsx|ts|tsx)$' }
          if ($forbidden) { throw "Forbidden browser/runtime files:`n$($forbidden -join "`n")" }
          $publishFiles = Get-ChildItem artifacts\publish\win-x64 -Recurse -File
          $runtimeFiles = $publishFiles | Where-Object { $_.Extension -in '.html', '.htm' -or $_.Name -match 'Electron|WebView|Chromium|Three' }
          if ($runtimeFiles) { throw "Forbidden publish artifact:`n$($runtimeFiles.FullName -join "`n")" }
          $deps = Get-Content artifacts\publish\win-x64\PlcWiringTrainer.deps.json -Raw
          if ($deps -match 'Electron|WebView|Chromium|Three\.js') { throw 'Forbidden runtime dependency in deps.json' }
          $deviceAssets = @(Get-ChildItem artifacts\publish\win-x64\Assets\Devices -File)
          $xamlBinaries = @(Get-ChildItem artifacts\publish\win-x64 -Recurse -Filter *.xbf -File)
          if ($deviceAssets.Count -ne 7) { throw "Expected 7 active device assets, found $($deviceAssets.Count)" }
          if ($xamlBinaries.Count -ne 4) { throw "Expected 4 native XAML binaries, found $($xamlBinaries.Count)" }
          if (-not (Test-Path artifacts\publish\win-x64\PlcWiringTrainer.pri -PathType Leaf)) {
            throw 'Native PlcWiringTrainer.pri is missing from publish output'
          }
      - name: Package portable release and SHA-256 manifest
        shell: pwsh
        run: |
          $publishRoot = (Resolve-Path artifacts\publish\win-x64).Path
          $manifestPath = Join-Path $publishRoot 'SHA256SUMS.txt'
          Get-ChildItem $publishRoot -File -Recurse |
            Where-Object FullName -ne $manifestPath |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($publishRoot, $_.FullName).Replace('\', '/')
              "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $relative"
            } | Set-Content $manifestPath -Encoding utf8NoBOM
          Compress-Archive -Path "$publishRoot\*" -DestinationPath artifacts\PlcWiringTrainer-4.3.0-win-x64.zip
      - name: Upload portable release
        uses: actions/upload-artifact@v6
        with:
          name: PlcWiringTrainer-4.3.0-win-x64
          path: |
            artifacts/PlcWiringTrainer-4.3.0-win-x64.zip
            artifacts/publish/win-x64/SHA256SUMS.txt

  windows-ui:
    needs: verify
    environment: isolated-ui
    runs-on: [self-hosted, windows, x64, plc-wiring-ui, interactive, hyperv, display-1920x1080-dpi100]
    timeout-minutes: 90
    concurrency:
      group: plc-wiring-interactive-ui
      cancel-in-progress: false
    env:
      PLCW_POINTER_UI_TESTS: 1
      PLCW_DISPLAY_PROFILE: display-1920x1080-dpi100
      PLCW_UI_EVIDENCE_ROOT: ${{ github.workspace }}\artifacts\ui-evidence
      PLCW_NATIVE_EXE: ${{ github.workspace }}\artifacts\tested-release\PlcWiringTrainer.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PlcWiringTrainer.slnx
      - uses: actions/download-artifact@v6
        with:
          name: PlcWiringTrainer-4.3.0-win-x64
          path: artifacts\download
      - name: Extract and verify the exact portable artifact
        shell: pwsh
        run: |
          Expand-Archive artifacts\download\PlcWiringTrainer-4.3.0-win-x64.zip artifacts\tested-release
          .\scripts\ci\Verify-PortableManifest.ps1 -PublishRoot artifacts\tested-release
          .\scripts\ci\Assert-InteractiveSession.ps1 -Width 1920 -Height 1080 -Dpi 96
      - name: Run isolated native UI suite ten times
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            $run = $_
            $result = "artifacts\TestResults\UiRun$run"
            dotnet test native\PlcWiringTrainer.UiTests\PlcWiringTrainer.UiTests.csproj -c Release -p:Platform=x64 --no-restore --logger "trx;LogFileName=ui-run-$run.trx" --results-directory $result
            if ($LASTEXITCODE -ne 0) { throw "Native UI run $run failed" }
          }
      - name: Verify desktop shortcut opens the native window
        shell: pwsh
        run: |
          if (Get-Process PlcWiringTrainer -ErrorAction SilentlyContinue) {
            throw 'A residual PlcWiringTrainer process exists before shortcut verification'
          }
          $shortcutPath = Join-Path $env:PLCW_UI_EVIDENCE_ROOT 'PLC Wiring Trainer.lnk'
          New-Item -ItemType Directory -Path $env:PLCW_UI_EVIDENCE_ROOT -Force | Out-Null
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          $shortcut.TargetPath = $env:PLCW_NATIVE_EXE
          $shortcut.WorkingDirectory = Split-Path $env:PLCW_NATIVE_EXE
          $shortcut.Save()
          Start-Process -FilePath $shortcutPath
          $deadline = [DateTime]::UtcNow.AddSeconds(20)
          do {
            $process = Get-Process PlcWiringTrainer -ErrorAction SilentlyContinue |
              Where-Object MainWindowTitle |
              Select-Object -First 1
            if ($process) { break }
            Start-Sleep -Milliseconds 200
          } while ([DateTime]::UtcNow -lt $deadline)
          if (-not $process) { throw 'The desktop shortcut did not open a native window' }
          "shortcutWindowTitle=$($process.MainWindowTitle)" | Set-Content (Join-Path $env:PLCW_UI_EVIDENCE_ROOT 'shortcut.txt')
          $process.CloseMainWindow() | Out-Null
          if (-not $process.WaitForExit(5000)) { throw 'The shortcut process did not exit cleanly' }
      - name: Reject residual native processes
        if: always()
        shell: pwsh
        run: |
          $residual = Get-Process PlcWiringTrainer -ErrorAction SilentlyContinue
          if ($residual) {
            $residual | Select-Object Id, ProcessName, MainWindowTitle | Format-Table | Out-String |
              Set-Content (Join-Path $env:PLCW_UI_EVIDENCE_ROOT 'residual-processes.txt')
            throw 'Residual PlcWiringTrainer processes remain after native UI verification'
          }
      - name: Verify UI evidence completeness
        if: success()
        shell: pwsh
        run: |
          .\scripts\ci\Assert-UiEvidence.ps1 `
            -EvidenceRoot $env:PLCW_UI_EVIDENCE_ROOT `
            -MinimumRuns 10 `
            -DisplayProfile $env:PLCW_DISPLAY_PROFILE `
            -PortableZip artifacts\download\PlcWiringTrainer-4.3.0-win-x64.zip
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-ui-evidence
          path: |
            artifacts/ui-evidence/**
            artifacts/TestResults/UiRun*/**

  windows-ui-dpi-matrix:
    needs: verify
    environment: isolated-ui
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile:
          - display-1280x720-dpi100
          - display-1280x720-dpi125
          - display-1280x720-dpi150
          - display-1920x1080-dpi125
          - display-1920x1080-dpi150
    runs-on: [self-hosted, windows, x64, plc-wiring-ui, interactive, hyperv, "${{ matrix.profile }}"]
    timeout-minutes: 45
    concurrency:
      group: plc-wiring-interactive-ui
      cancel-in-progress: false
    env:
      PLCW_POINTER_UI_TESTS: 1
      PLCW_DISPLAY_PROFILE: ${{ matrix.profile }}
      PLCW_UI_EVIDENCE_ROOT: ${{ github.workspace }}\artifacts\ui-evidence\${{ matrix.profile }}
      PLCW_NATIVE_EXE: ${{ github.workspace }}\artifacts\tested-release\PlcWiringTrainer.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PlcWiringTrainer.slnx
      - uses: actions/download-artifact@v6
        with:
          name: PlcWiringTrainer-4.3.0-win-x64
          path: artifacts\download
      - name: Extract and verify the exact portable artifact
        shell: pwsh
        run: |
          Expand-Archive artifacts\download\PlcWiringTrainer-4.3.0-win-x64.zip artifacts\tested-release
          .\scripts\ci\Verify-PortableManifest.ps1 -PublishRoot artifacts\tested-release
          $profile = '${{ matrix.profile }}'
          if ($profile -notmatch '^display-(\d+)x(\d+)-dpi(100|125|150)$') {
            throw "Invalid display profile: $profile"
          }
          $dpi = switch ([int]$Matches[3]) { 100 { 96 } 125 { 120 } 150 { 144 } }
          .\scripts\ci\Assert-InteractiveSession.ps1 `
            -Width ([int]$Matches[1]) -Height ([int]$Matches[2]) -Dpi $dpi
      - name: Run native UI flow at configured display profile
        run: dotnet test native\PlcWiringTrainer.UiTests\PlcWiringTrainer.UiTests.csproj -c Release -p:Platform=x64 --no-restore --logger "trx;LogFileName=ui-${{ matrix.profile }}.trx" --results-directory artifacts\TestResults\UiMatrix
      - name: Verify display-profile evidence completeness
        if: success()
        shell: pwsh
        run: |
          .\scripts\ci\Assert-UiEvidence.ps1 `
            -EvidenceRoot $env:PLCW_UI_EVIDENCE_ROOT `
            -MinimumRuns 1 `
            -DisplayProfile $env:PLCW_DISPLAY_PROFILE `
            -PortableZip artifacts\download\PlcWiringTrainer-4.3.0-win-x64.zip
      - name: Upload display-profile evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-ui-${{ matrix.profile }}
          path: |
            artifacts/ui-evidence/**
            artifacts/TestResults/UiMatrix/**

  windows-portable:
    needs: verify
    environment: isolated-ui
    runs-on: [self-hosted, windows, x64, plc-wiring-portable, interactive, hyperv, clean-snapshot, no-dev-sdk, display-1920x1080-dpi100]
    timeout-minutes: 30
    concurrency:
      group: plc-wiring-clean-portable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: PlcWiringTrainer-4.3.0-win-x64
          path: artifacts\download
      - name: Extract and verify the exact portable artifact
        shell: pwsh
        run: |
          Expand-Archive artifacts\download\PlcWiringTrainer-4.3.0-win-x64.zip artifacts\tested-release
          .\scripts\ci\Verify-PortableManifest.ps1 -PublishRoot artifacts\tested-release
          .\scripts\ci\Assert-InteractiveSession.ps1 -Width 1920 -Height 1080 -Dpi 96
      - name: Verify shortcut, autosave recovery, clean exit, and isolated data root
        shell: pwsh
        run: |
          .\scripts\ci\Verify-CleanPortable.ps1 `
            -Executable artifacts\tested-release\PlcWiringTrainer.exe `
            -DataRoot artifacts\portable-data `
            -EvidenceRoot artifacts\portable-evidence `
            -PortableZip artifacts\download\PlcWiringTrainer-4.3.0-win-x64.zip
      - name: Upload clean portable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-portable-evidence
          path: artifacts/portable-evidence/**

  release-gate:
    if: always()
    needs: [verify, windows-ui, windows-ui-dpi-matrix, windows-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Reject missing, skipped, cancelled, or failed verification
        shell: bash
        run: |
          test "${{ needs.verify.result }}" = "success"
          test "${{ needs.windows-ui.result }}" = "success"
          test "${{ needs.windows-ui-dpi-matrix.result }}" = "success"
          test "${{ needs.windows-portable.result }}" = "success"
